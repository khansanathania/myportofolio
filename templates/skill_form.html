{% extends "base.html" %}

{% block meta %}
    <title>Edit Skill - {{ name }}</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="experience-section" id="skills">
        <div class="container">
            <p class="section-kicker">Perbarui skill</p>

            <div class="project-header">
                <h1>Edit Skill</h1>
            </div>

            <form method="post" class="project-form">
                {% csrf_token %}

                {% for field in form %}
                    <div class="form-group">
                        <label for="{{ field.id_for_label }}">
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% for error in field.errors %}
                            <p class="form-error">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endfor %}

                <div class="project-form-modal__actions">
                    <a href="{% url 'main:show_skills' %}"
                       class="button button-secondary">
                        Batal
                    </a>

                    <button type="submit" class="button">
                        Simpan Perubahan
                    </button>
                </div>
            </form>
        </div>
    </section>
</main>
{% endblock content %}
